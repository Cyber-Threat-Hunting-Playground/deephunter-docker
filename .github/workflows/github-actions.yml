name: DeepHunter Docker CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: deephunter
  IMAGE_TAG: test-${{ github.sha }}

jobs:

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts with ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts/ -name "*.sh" -exec shellcheck {} +
          shellcheck build.sh

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet


  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > /tmp/deephunter-image.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: docker-image
          path: /tmp/deephunter-image.tar.gz
          retention-days: 1


  test:
    name: Test Services
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/deephunter-image.tar.gz | docker load

      - name: Create .env file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d

      - name: Cleanup
        if: always()
        run: docker compose down -v


  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/deephunter-image.tar.gz | docker load

      - name: Run Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          severity: 'CRITICAL,HIGH'
