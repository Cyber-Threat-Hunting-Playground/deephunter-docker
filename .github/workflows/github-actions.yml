name: DeepHunter Docker CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: cyberthreatplayground/deephunter

jobs:

  # ── Lint & validate ────────────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts with ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts/ -name "*.sh" -exec shellcheck {} +
          shellcheck build.sh

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet


  # ── Build ──────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > /tmp/deephunter-image.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: docker-image
          path: /tmp/deephunter-image.tar.gz
          retention-days: 1


  # ── Test ───────────────────────────────────────────────────────────
  test:
    name: Test Services
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          gunzip -c /tmp/deephunter-image.tar.gz | docker load
          docker tag ${{ env.IMAGE_NAME }}:latest deephunter:latest

      - name: Create .env file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy state
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              echo "Services are healthy."
              break
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down -v


  # ── Security scan ──────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: gunzip -c /tmp/deephunter-image.tar.gz | docker load

      - name: Run Trivy vulnerability scanner (CRITICAL — fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Run Trivy vulnerability scanner (HIGH — warn)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          severity: 'HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'


  # ── Publish to Docker Hub (tag pushes only) ────────────────────────
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, security-scan ]
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_HUB_README.md
          short-description: "DeepHunter Security Analytics Platform — production-ready Docker image"


  # ── Sign image + attach SBOM ───────────────────────────────────────
  sign:
    name: Sign Image & Attach SBOM
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign the image (keyless via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.publish.outputs.image-ref }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attach SBOM to image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign attach sbom \
            --sbom sbom.cdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
