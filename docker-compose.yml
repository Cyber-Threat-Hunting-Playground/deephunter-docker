services:

  redis:
    image: redis:latest
    container_name: deephunter-redis
    restart: always
    networks:
      - backend
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:lts
    container_name: deephunter-mariadb
    restart: always
    networks:
      - backend
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-deephunter}
      MARIADB_USER: ${MARIADB_USER:-deephunter}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-Awes0meP4ssW0rd}
      MYSQL_INITDB_SKIP_TZINFO: 1
      ADMINER_DB_USER: ${ADMINER_DB_USER:-}
      ADMINER_DB_PASSWORD: ${ADMINER_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deephunter:
    image: ${DEEPHUNTER_IMAGE:-deephunter:latest}
    container_name: deephunter-app
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./data/settings.py:/data/deephunter/deephunter/settings.py:ro
      - ./data/logs:/var/log/deephunter
      - ./data/backups:/data/backups
      - ./scripts/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    ports:
      - "${DEEPHUNTER_PORT:-9000}:443"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${MARIADB_DATABASE:-deephunter}
      - DB_USER=${MARIADB_USER:-deephunter}
      - DB_PASSWORD=${MARIADB_PASSWORD:-Awes0meP4ssW0rd}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_DATA_RETENTION=${DB_DATA_RETENTION:-90}
      - ENABLE_CRON=${ENABLE_CRON:-false}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-30 10 * * *}
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--", "/docker-entrypoint.sh"]
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k https://localhost:443/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  adminer:
    image: adminer:latest
    container_name: deephunter-adminer
    restart: unless-stopped
    profiles:
      - adminer
    networks:
      - backend
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb_data:
    driver: local

networks:
  backend:
    driver: bridge
